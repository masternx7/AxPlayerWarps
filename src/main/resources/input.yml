# DOCUMENTATION: https://docs.papermc.io/paper/dev/dialogs/
# All inputs now use the Paper Dialog API (requires Paper 1.21.7+).
#
# input types:
#   text          - normal text field
#   number        - number range slider
#   bool          - true/false checkbox
#   single        - single option selector
#
# built-in placeholders in title/body/labels: %player%
# PlaceholderAPI placeholders are also supported.

rate:
  title: "Rate Warp"
  body:
    - "Select a rating from 1 to 5."
  input:
    type: "number"
    key: "value"
    label: "Rating"
    min: 1
    max: 5
    step: 1
    initial: 5
    width: 200
  confirm:
    label: "Rate"
    tooltip: "Submit your rating"
  cancel:
    label: "Cancel"
    tooltip: "Close without rating"

search:
  title: "Search Warps"
  body:
    - "Type a warp name or an owner's name."
  input:
    type: "text"
    key: "value"
    label: "Search"
    max-length: 64
  confirm:
    label: "Search"
    tooltip: "Search for warps"
  cancel:
    label: "Cancel"
    tooltip: "Close"

rename:
  title: "Rename Warp"
  body:
    - "Type the new warp name."
  input:
    type: "text"
    key: "value"
    label: "New name"
    max-length: 16
  confirm:
    label: "Rename"
    tooltip: "Apply the new name"
  cancel:
    label: "Cancel"
    tooltip: "Keep the current name"

price:
  title: "Teleport Price"
  body:
    - "Type the new teleport price."
    - "Use 0 to make the warp free."
  input:
    type: "text"
    key: "value"
    label: "Price"
    max-length: 16
  confirm:
    label: "Save"
    tooltip: "Set the new price"
  cancel:
    label: "Cancel"
    tooltip: "Keep the current price"

add-line:
  title: "Add Description Line"
  body:
    - "Type the new description line."
  input:
    type: "text"
    key: "value"
    label: "Line"
    max-length: 50
  confirm:
    label: "Add"
    tooltip: "Add this line"
  cancel:
    label: "Cancel"
    tooltip: "Do not add"

add-player:
  title: "Add Player"
  body:
    - "Type the player's name."
  input:
    type: "text"
    key: "value"
    label: "Player"
    max-length: 16
  confirm:
    label: "Add"
    tooltip: "Add the player"
  cancel:
    label: "Cancel"
    tooltip: "Close"

transfer:
  title: "Transfer Warp"
  body:
    - "Type the name of the player who should receive this warp."
  input:
    type: "text"
    key: "value"
    label: "Player"
    max-length: 16
  confirm:
    label: "Transfer"
    tooltip: "Transfer ownership"
  cancel:
    label: "Cancel"
    tooltip: "Keep ownership"

# do not change this
version: 2
